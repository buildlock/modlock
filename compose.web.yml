name: modlock-web-local
services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: modlock
      POSTGRES_DB: modlock
      POSTGRES_PASSWORD: ${MODLOCK_DB_PASSWORD:?Run pnpm accounts:setup first}
    ports:
      - "127.0.0.1:54339:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modlock -d modlock"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"
volumes:
  postgres:
