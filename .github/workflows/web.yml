name: Website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    name: Website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: modlock
          POSTGRES_DB: modlock
          POSTGRES_PASSWORD: modlock-ci-fixture
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U modlock -d modlock"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      MODLOCK_LOCAL_ACCOUNTS: "1"
      DATABASE_URL: postgresql://modlock:modlock-ci-fixture@127.0.0.1:54339/modlock
      BETTER_AUTH_URL: http://127.0.0.1:4310
      MODLOCK_MAIL_TRANSPORT: outbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate an ephemeral test authentication secret
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "BETTER_AUTH_SECRET=" + require("node:crypto").randomBytes(48).toString("hex") + "\n")'
      - run: pnpm accounts:migrate
      - run: pnpm test:web
      - run: pnpm test:accounts
      - run: pnpm build
      - run: pnpm test:http
