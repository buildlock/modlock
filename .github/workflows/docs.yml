name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.1 fmt --all --check
      - name: Check all targets
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Exercise synthetic transactions and process termination
        run: cargo +1.98.1 test --workspace --locked -- --nocapture
      - name: Exercise actual storage exhaustion in a bounded filesystem
        if: runner.os == 'Linux'
        run: python3 -I -B scripts/check_enospc.py
      - name: Install pinned dependency audit tool
        if: runner.os == 'Linux'
        run: cargo +1.98.1 install cargo-audit --version 0.22.2 --locked --root target/audit-tools
      - name: Audit locked dependencies
        if: runner.os == 'Linux'
        run: target/audit-tools/bin/cargo-audit audit

  validate:
    name: Validate documentation
    needs: core
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both core platforms
        if: needs.core.result != 'success'
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Run fresh hash-locked repository gates
        run: python -I -B scripts/check_fresh.py
